# Chạy trên aicenter: ~/f2mapp (mã nguồn giải nén ở ~/f2mapp/src). Công khai qua Cloudflare Tunnel (pcdex.app).
#   web  http://192.168.110.136:8141 (LAN) · https://pcdex.app (Cloudflare Tunnel)
#   api  http://192.168.110.136:8140
name: f2m

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-bookworm
    container_name: f2m_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: f2m
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt trong ~/f2mapp/.env}
      POSTGRES_DB: f2m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2m -d f2m"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build: { context: ./src, dockerfile: deploy/Dockerfile.api }
    image: f2m-api
    container_name: f2m_api
    restart: unless-stopped
    environment:
      PORT: "8140"
      DATABASE_URL: postgres://f2m:${POSTGRES_PASSWORD}@db:5432/f2m
      CORS_ORIGIN: http://192.168.110.136:8141,https://pcdex.app
      # Trang web người dùng mở để gắn kết quả quét máy (QR của f2m-scan trỏ tới đây)
      WEB_URL: ${WEB_URL:-https://pcdex.app}
      # Client ID Google (web,android,ios), cách nhau dấu phẩy. Trống = tắt đăng nhập Google
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # auto: cookie Secure khi vào bằng HTTPS (https://pcdex.app qua Cloudflare), vẫn đăng nhập được qua LAN http
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    ports: ["8140:8140"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  web:
    build: { context: ./src, dockerfile: deploy/Dockerfile.web }
    image: f2m-web
    container_name: f2m_web
    restart: unless-stopped
    environment:
      API_URL: http://api:8140
    ports: ["8141:3000"]
    depends_on: [api]
    logging: *logging

volumes:
  pgdata:
