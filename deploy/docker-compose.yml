# Chạy trên aicenter: ~/f2mapp (mã nguồn giải nén ở ~/f2mapp/src). Chỉ trong LAN.
#   web  http://192.168.110.136:8141
#   api  http://192.168.110.136:8140
name: f2m

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-bookworm
    container_name: f2m_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: f2m
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt trong ~/f2mapp/.env}
      POSTGRES_DB: f2m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2m -d f2m"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build: { context: ./src, dockerfile: deploy/Dockerfile.api }
    image: f2m-api
    container_name: f2m_api
    restart: unless-stopped
    environment:
      PORT: "8140"
      DATABASE_URL: postgres://f2m:${POSTGRES_PASSWORD}@db:5432/f2m
      CORS_ORIGIN: http://192.168.110.136:8141
      AUTH_PEPPER: ${AUTH_PEPPER:?đặt trong ~/f2mapp/.env}
      # Client ID Google (web,android,ios), cách nhau dấu phẩy. Trống = tắt đăng nhập Google
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      # console = chưa gửi SMS thật. AUTH_DEV_OTP=1 trả mã về màn hình — TẮT khi mở ra internet
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      AUTH_DEV_OTP: ${AUTH_DEV_OTP:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports: ["8140:8140"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  web:
    build: { context: ./src, dockerfile: deploy/Dockerfile.web }
    image: f2m-web
    container_name: f2m_web
    restart: unless-stopped
    environment:
      API_URL: http://api:8140
    ports: ["8141:3000"]
    depends_on: [api]
    logging: *logging

volumes:
  pgdata:
